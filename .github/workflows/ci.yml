name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # OFL 1.1 sections 2 and 5: the license travels with the font, unrelicensed.
      - name: The OFL travels with the fonts
        run: |
          [ -s OFL.txt ] || { echo "OFL.txt is missing"; exit 1; }
          grep -q 'Open Font License' LICENSE || { echo "LICENSE lost the OFL carve-out"; exit 1; }

      # The reason the font exists: one advance, the 0.62em cell 0xProto uses.
      - name: Both cuts are monospaced at 0.62em
        run: |
          uv run -q --no-project --with 'fonttools>=4.50' python -I - <<'EOF'
          import sys
          from fontTools.ttLib import TTFont
          bad = 0
          for f, style in [("ScienceGothicMono.ttf", "Regular"), ("ScienceGothicMono-Bold.ttf", "Bold")]:
              t = TTFont(f)
              n = t["name"]
              adv = {a for a, _ in t["hmtx"].metrics.values() if a}
              want = round(0.62 * t["head"].unitsPerEm)
              checks = {
                  "family is Science Gothic Mono": n.getDebugName(1) == "Science Gothic Mono",
                  f"style is {style}": n.getDebugName(2) == style,
                  "post.isFixedPitch is set": t["post"].isFixedPitch != 0,
                  f"one advance of {want} units (got {sorted(adv)[:5]})": adv == {want},
                  "nameID 13 carries the OFL": "Open Font License" in (n.getDebugName(13) or ""),
                  "nameID 0 keeps the upstream copyright": "Science Gothic" in (n.getDebugName(0) or ""),
              }
              for what, ok in checks.items():
                  print(f"{'ok  ' if ok else 'FAIL'} {f}: {what}")
                  bad += not ok
          sys.exit(bad)
          EOF

      - name: The catalogue is valid and README's table is current
        run: uv run -q catalog.py --check

      # A real install, because the catalogue's family names and download links
      # are only right if fontconfig ends up answering to them.
      - name: install.sh installs from the catalogue
        run: |
          shellcheck install.sh
          command -v fc-list >/dev/null || sudo apt-get install -y -q fontconfig
          export XDG_DATA_HOME="$RUNNER_TEMP/share"
          # One .tar.xz and one bare .ttf, the two shapes the catalogue has.
          ./install.sh '0xProto Nerd Font' 'Science Gothic'
          [ "$(./install.sh '0xProto Nerd Font' 'Science Gothic' | grep -cF 'already installed')" = 2 ]

      - name: No absolute home paths
        run: |
          if git grep -nIE '(/home/|/Users/)[A-Za-z][A-Za-z0-9._-]*' -- . | grep -v '/home/linuxbrew'; then
            echo "Use \$HOME or ~ instead of an absolute home path."; exit 1
          fi

      # mkmono.py pins its upstream and its fontTools, and its output is the same
      # bytes every run. So this proves the fonts came from the script as it is
      # now, which the checks above cannot: they only look at the files.
      - name: The committed cuts are what mkmono.py writes
        run: |
          uv run -q mkmono.py
          git diff --exit-code --stat -- '*.ttf' || { echo "Run 'uv run mkmono.py' and commit the fonts with it."; exit 1; }

      # What the icon font promises whoever draws from it, checked on the
      # committed files: the table and the font agree, and a width can be
      # declared once for the whole set.
      - name: The icon font is its icons, one width, with its license
        run: |
          [ -s MIT-material-icon-theme.txt ] || { echo "MIT-material-icon-theme.txt is missing"; exit 1; }
          grep -q 'Material Extensions' LICENSE || { echo "LICENSE lost the Material Icon Theme notice"; exit 1; }
          uv run -q --no-project --with 'fonttools>=4.50' python -I - <<'EOF'
          import sys
          from fontTools.ttLib import TTFont
          f = TTFont("MaterialIconTheme.ttf")
          cmap = f.getBestCmap()
          rows = [l.rstrip("\n").split("\t") for l in open("material-icons.tsv") if not l.startswith("#")]
          icons = {name: int(cp, 16) for kind, name, cp in rows if kind == "icon"}
          named = {icon for kind, _, icon in rows if kind != "icon"}
          n = f["name"]
          adv = {a for a, _ in f["hmtx"].metrics.values()}
          checks = {
              "family is Material Icon Theme": n.getDebugName(1) == "Material Icon Theme",
              f"the table and the font name the same {len(icons)} code points": set(icons.values()) == set(cmap),
              "no two icons share a code point": len(set(icons.values())) == len(icons),
              "every icon is in Supplementary Private Use Area-B": all(0x100000 <= c <= 0x10FFFD for c in cmap),
              "it is a COLR version 0 font with a palette": "COLR" in f and f["COLR"].version == 0 and "CPAL" in f,
              f"one advance, the em (got {sorted(adv)[:5]})": adv == {f["head"].unitsPerEm},
              "post.isFixedPitch is set": f["post"].isFixedPitch != 0,
              "nameID 0 keeps upstream's copyright": "Material Extensions" in (n.getDebugName(0) or ""),
              "nameID 13 carries the MIT license": "MIT License" in (n.getDebugName(13) or ""),
              "every association names an icon that exists": named <= set(icons),
              "every folder icon has an -open twin": all(i + "-open" in icons for k, _, i in rows if k == "folder"),
          }
          bad = 0
          for what, ok in checks.items():
              print(f"{'ok  ' if ok else 'FAIL'} MaterialIconTheme.ttf: {what}")
              bad += not ok
          sys.exit(bad)
          EOF

      # mkicons.py pins its upstream by hash and its packages by lock file, and
      # its output is the same bytes every run. About five minutes here: it is
      # 1256 SVGs through a path-boolean engine.
      - name: The committed icon font is what mkicons.py writes
        run: |
          uv run -q mkicons.py
          git diff --exit-code --stat -- MaterialIconTheme.ttf material-icons.tsv MIT-material-icon-theme.txt \
            || { echo "Run 'uv run mkicons.py' and commit what it writes with it."; exit 1; }

  # The one required check. A skipped job counts as passing, so this runs always.
  ci-ok:
    name: ci ok
    if: always()
    needs: [fonts]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.fonts.result }}" = success ] || { echo "fonts: ${{ needs.fonts.result }}"; exit 1; }
